<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Kto Ma Rację? — otwieranie aplikacji</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf6f7;
    color: #2b1e24;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 32px 20px; box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14090f; color: #f5e8ec; }
    .muted { color: #b89aa4 !important; }
  }
  .wrap { max-width: 380px; }
  .logo { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  p { font-size: 15px; line-height: 1.5; margin: 8px 0; }
  .muted { color: #7a6670; font-size: 13px; }
  .btn {
    display: inline-block; margin-top: 22px; padding: 14px 30px;
    border-radius: 14px; background: linear-gradient(135deg,#e04f7b,#8a4fa0);
    color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
  }
  .btn:active { opacity: .85; }
  #err { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">💛</div>
    <h1>Kto Ma Rację?</h1>
    <p id="msg">Otwieramy aplikację…<br><span class="muted">Opening the app…</span></p>
    <a id="openBtn" class="btn" href="#" rel="noreferrer">Otwórz w aplikacji · Open the app</a>
    <p class="muted" id="hint" style="margin-top:16px">
      Jeśli nic się nie stało, dotknij przycisku powyżej.<br>
      If nothing happened, tap the button above.
    </p>
    <p id="err" class="muted">Nieprawidłowy lub niekompletny link. Poproś o nowy.<br>Invalid or incomplete link. Please request a new one.</p>
  </div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(window.location.search);
  var tokenHash = q.get("token_hash") || "";
  var type = q.get("type") || "";
  // Map the Supabase email OTP type to the app's deep-link path.
  var path = type === "recovery" ? "reset-password"
           : (type === "email" || type === "signup") ? "confirm"
           : null;

  var btn = document.getElementById("openBtn");
  var msg = document.getElementById("msg");
  var hint = document.getElementById("hint");
  var err = document.getElementById("err");

  if (!path || !tokenHash) {
    msg.style.display = "none";
    btn.style.display = "none";
    hint.style.display = "none";
    err.style.display = "block";
    return;
  }

  var target = "ktomaracje://" + path
    + "?token_hash=" + encodeURIComponent(tokenHash)
    + "&type=" + encodeURIComponent(type);

  btn.setAttribute("href", target);

  // Attempt to open the app automatically. Some mobile browsers block a
  // custom-scheme navigation without a user gesture — the button above is the
  // guaranteed fallback (a tap IS a gesture).
  try { window.location.href = target; } catch (e) { /* button remains */ }
})();
</script>
</body>
</html>
